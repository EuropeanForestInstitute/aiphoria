[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aiphoria"
version = "1.1.0"
authors = [
    { name="Janne Järvikylä", email="janne.jarvikyla@efi.int" },
]
maintainers = [
    { name="Janne Järvikylä", email="janne.jarvikyla@efi.int" },
]
description = "Dynamic MFA tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.2.2,<3",
    "plotly>=6.0.0,<7",
    "openpyxl>=3.1.3,<4",
    "scipy",
    "matplotlib",
    "xlrd",
    "xlwt",
    "tqdm",
    "xlsxwriter",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/EuropeanForestInstitute/aiphoria"
Issues = "https://github.com/EuropeanForestInstitute/aiphoria/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Exclude dotfiles
[tool.setuptools.exclude-package-data]
"aiphoria.assets.datavisualizer" = [".*"]
"aiphoria.assets.network_graph" = [".*"]

# Include HTML templates and JS files
[tool.setuptools.package-data]
"aiphoria.data" = ["example_scenario.xlsx"]
"aiphoria.assets.datavisualizer" = ["*.*"]
"aiphoria.assets.network_graph" = ["*.*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
minversion = "9.0"
addopts = ["--cov=aiphoria"]
testpaths = [
    "tests",
]
python_files = [
    "tests/test_builder.py",
    "tests/test_datachecker.py",
    "tests/test_datastructures.py",
    "tests/test_datavisualizer.py",
    "tests/test_example.py",
    "tests/test_flowsolver.py",
    "tests/test_flowmodifiersolver.py",
    "tests/test_reference_scenario.py",
    "tests/test_runner.py",
    "tests/test_visualizer_parameters.py",
]

[tool.coverage.run]
omit = [
    "src/aiphoria/__init__.py",
    "src/aiphoria/core/__init__.py",
    "src/aiphoria/assets/*",
    "src/aiphoria/lib/*",
    "src/aiphoria/core/logger.py",
]
